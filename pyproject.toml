[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brewvis-avrathod"
version = "0.1.0"
description = "Coffee-shop themed pandas + Matplotlib visualization helpers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Anupama Rathod" },
]
dependencies = [
    "pandas",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
